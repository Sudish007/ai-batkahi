  html, body { margin: 0; padding: 0; background: #FAF6EF; }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    background: #FAF6EF;
    color: #1F1B17;
    box-sizing: border-box;
    padding: 24px;
  }
  .frame {
    position: absolute; inset: 24px;
    border: 1px solid #D9D0C3;
  }
  .row {
    position: absolute; left: 96px; top: 150px;
    display: flex; align-items: center; gap: 56px;
  }
  svg { width: 160px; height: 160px; display: block; flex: none; }
  .wordmark {
    font-family: "Tiro Devanagari Hindi", serif;
    font-size: 96px; line-height: 1.1;
  }
  .wordmark-dev {
    font-family: "Tiro Devanagari Hindi", serif;
    font-size: 56px; line-height: 1.3; color: #5C554D;
    margin-top: 6px;
  }
  .tagline {
    position: absolute; left: 96px; top: 400px;
    font-family: "Noto Sans Devanagari", sans-serif;
    font-size: 36px; line-height: 1.5; color: #1F1B17;
  }
  .foot {
    position: absolute; left: 96px; right: 96px; bottom: 72px;
    border-top: 1px solid #D9D0C3;
    padding-top: 20px;
    font-family: "Noto Sans Devanagari", sans-serif;
    font-size: 28px; line-height: 1.4; color: #5C554D;
  }
</style>

    </svg>
    <div>
      <div class="wordmark">AI Batkahi</div>
      <div class="wordmark-dev">एआई बतकही</div>
    </div>
  </div>
  <div class="tagline">AI के बतकही, आपन भाषा में</div>
  <div class="foot">@batkahi · sudish007.github.io/ai-batkahi</div>
</div>
